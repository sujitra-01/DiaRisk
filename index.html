<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Diabetes Complication Risk Prediction Tool — guided screening and risk assessment.">
<title>Diabetes Complication Risk Prediction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Noto+Serif+Tamil:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
</head>
<body>
<div class="app-shell" id="appShell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" aria-label="Primary navigation">
    <div class="brand-lockup">
      <div class="brand-mark" aria-hidden="true"><span></span><i></i></div>
      <div><strong>Diabetes Risk</strong><em>Screening workspace</em></div>
    </div>
    <div class="sidebar-caption">Clinical prototype</div>
    <nav class="nav-list">
      <button class="nav-item active" data-view="dashboard" data-testid="nav-dashboard"><span class="nav-icon">⌂</span><span data-i18n="dashboard">Dashboard</span></button>
      <button class="nav-item" data-view="assessment" data-action="new" data-testid="nav-new-assessment"><span class="nav-icon">＋</span><span data-i18n="newAssessment">New assessment</span></button>
      <button class="nav-item" data-view="participants" data-testid="nav-participants"><span class="nav-icon">◉</span><span data-i18n="participants">Participants</span></button>
      <button class="nav-item" data-view="reports" data-testid="nav-reports"><span class="nav-icon">▤</span><span data-i18n="reports">Reports</span></button>
      <button class="nav-item" data-view="education" data-testid="nav-education"><span class="nav-icon">▱</span><span data-i18n="education">Education</span></button>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-item muted-action" data-view="settings" data-testid="nav-settings"><span class="nav-icon">⚙</span><span data-i18n="settings">Settings</span></button>
      <div class="profile-mini" id="profileMini"><span class="avatar" id="profileAvatar">—</span><span><b id="profileName">Researcher</b><small id="profileInstitution">Set in Settings</small></span></div>
    </div>
  </aside>

  <main class="main-canvas">
    <header class="topbar">
      <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>
      <div class="breadcrumb"><span class="eyebrow">RESEARCH WORKSPACE</span><span class="crumb-separator">/</span><span id="breadcrumbText">Dashboard</span></div>
      <div class="top-actions">
        <button class="language-toggle" id="languageToggle" aria-label="Toggle language" data-testid="lang-toggle"><b>EN</b><span>/</span><span>தமிழ்</span></button>
        <button class="icon-button" id="themeToggle" aria-label="Toggle theme" data-testid="theme-toggle">☾</button>
        <button class="help-button" data-action="notice" aria-label="Show notice">?</button>
      </div>
    </header>
    <div id="viewRoot" class="view-root"></div>
    <button class="mobile-context-fab" id="mobileContextFab" aria-label="Open live score" data-testid="mobile-context-fab" style="display:none">
      <span class="fab-label">Live score</span><span class="fab-value" id="fabValue">—</span>
    </button>
  </main>

  <aside class="context-panel" id="contextPanel" aria-label="Assessment context">
    <div class="context-top"><span class="eyebrow">ASSESSMENT CONTEXT</span><button id="collapseContext" class="context-close" aria-label="Collapse context panel">×</button></div>
    <div id="contextContent"></div>
  </aside>
</div>

<div class="mobile-sheet" id="mobileSheet" role="dialog" aria-hidden="true">
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet-body">
    <div class="sheet-grip"></div>
    <div id="sheetContent"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<style>
:root{--bg:#f5f3ee;--surface:#fffdfa;--surface-2:#edeae3;--ink:#17324d;--ink-2:#4b5d6b;--muted:#83909a;--line:#dfe2df;--teal:#2c8a83;--teal-soft:#dcefeb;--amber:#b97929;--amber-soft:#f7e9d2;--coral:#b84f4f;--coral-soft:#f6dddd;--shadow:0 20px 60px rgba(24,47,64,.07);--radius:18px;--ease:cubic-bezier(.23,1,.32,1)}
html.dark{--bg:#14222b;--surface:#1b2d37;--surface-2:#203744;--ink:#f5f2ea;--ink-2:#b9c9cd;--muted:#8da1a8;--line:#34505a;--teal:#62c2b1;--teal-soft:#254b4b;--amber:#e6aa5a;--amber-soft:#4e3a24;--coral:#f08383;--coral-soft:#4c2b32;--shadow:0 22px 80px rgba(0,0,0,.2)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit}
button{border:0;background:none;color:inherit}
button:not(:disabled){cursor:pointer}
html.lang-ta body{font-family:'Noto Sans Tamil',Manrope,system-ui,sans-serif}
html.lang-ta .brand-lockup strong,html.lang-ta .hero-panel h1,html.lang-ta .assessment-title h1,html.lang-ta .section-heading h2,html.lang-ta .question-card h2{font-family:'Noto Serif Tamil','DM Serif Display',serif}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,25,33,.45);backdrop-filter:blur(2px);z-index:25;opacity:0;transition:opacity .25s var(--ease)}
.sidebar-backdrop.show{display:block;opacity:1}
.app-shell{min-height:100vh;display:grid;grid-template-columns:242px minmax(0,1fr) 292px;max-width:1680px;margin:0 auto;box-shadow:var(--shadow)}
@media(min-width:1681px){body{background:var(--surface-2)}}
.sidebar{background:var(--ink);color:#eff3ee;padding:28px 18px 20px;display:flex;flex-direction:column;min-height:100vh}
.brand-lockup{display:flex;align-items:center;gap:11px;padding:0 10px 34px}
.brand-lockup strong{display:block;font-family:"DM Serif Display",serif;font-size:18px;font-weight:400;letter-spacing:.01em}
.brand-lockup em{font-style:normal;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9db3b7;opacity:.9}
.brand-mark{width:32px;height:32px;border:1px solid #556f7d;border-radius:8px;display:grid;place-items:center;position:relative}
.brand-mark span{width:14px;height:14px;background:var(--teal);border-radius:3px;display:block}
.brand-mark i{position:absolute;right:5px;bottom:5px;width:6px;height:6px;background:#eff3ee;border-radius:2px}
.sidebar-caption{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#9db3b7;margin:0 10px 14px}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:#dfe6e2;font-weight:600;text-align:left;transition:background .2s var(--ease),color .2s var(--ease)}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(98,194,177,.15);color:#eff3ee}
.nav-icon{width:22px;text-align:center;font-size:14px;color:#9fb6b8}
.sidebar-footer{margin-top:auto;padding-top:20px}
.profile-mini{display:flex;align-items:center;gap:10px;padding:12px 10px;border-top:1px solid rgba(255,255,255,.08);margin-top:10px;color:#dfe6e2}
.profile-mini .avatar{width:32px;height:32px;border-radius:8px;background:var(--teal);color:#0e1e26;display:grid;place-items:center;font-weight:800;font-size:12px}
.profile-mini b{font-weight:700;font-size:12.5px}
.profile-mini small{display:block;font-size:10.5px;color:#9db3b7;letter-spacing:.03em}
.profile-mini .dots{margin-left:auto;color:#5a7683}
.main-canvas{background:var(--bg);display:flex;flex-direction:column;min-width:0}
.topbar{height:72px;padding:0 32px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);background:var(--bg)}
.mobile-menu{display:none;font-size:20px}
.breadcrumb{display:flex;align-items:center;gap:10px;color:var(--ink-2)}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.crumb-separator{color:var(--muted)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.language-toggle{padding:8px 12px;border:1px solid var(--line);border-radius:20px;font-size:11px;letter-spacing:.06em;display:flex;gap:5px;align-items:center;background:var(--surface)}
.language-toggle b{color:var(--ink)}
.language-toggle span{color:var(--muted)}
.icon-button,.help-button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);transition:all .2s var(--ease)}
.icon-button:hover,.help-button:hover{border-color:var(--teal);color:var(--teal)}
.view-root{padding:44px 40px 90px;min-height:calc(100vh - 72px);animation:rise .32s var(--ease)}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:end;margin-bottom:44px}
.hero-panel{max-width:640px}
.hero-kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);font-weight:800;margin-bottom:14px}
.hero-panel h1{font:400 clamp(38px,5vw,58px)/1.06 "DM Serif Display",serif;letter-spacing:-.02em;margin:0 0 18px}
.hero-panel p{color:var(--ink-2);font-size:15.5px;max-width:520px;margin:0 0 26px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.button-primary,.button-secondary{padding:13px 20px;border-radius:11px;font-weight:800;transition:all .2s var(--ease);min-height:46px;display:inline-flex;align-items:center;gap:6px}
.button-primary{background:var(--teal);color:#fff;box-shadow:0 8px 22px rgba(44,138,131,.22)}
.button-primary:hover{background:#24736e;transform:translateY(-2px)}
.button-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.button-secondary:hover{border-color:var(--teal);color:var(--teal)}
.button-danger{background:var(--coral);color:#fff;padding:13px 20px;border-radius:11px;font-weight:800;transition:all .2s var(--ease)}
.button-danger:hover{background:#a24444}
.notice{padding:14px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--ink-2);font-size:12.5px;background:var(--surface)}
.hero-art{border-radius:24px;background:radial-gradient(120% 90% at 20% 10%,var(--teal-soft) 0,transparent 60%),radial-gradient(90% 70% at 80% 100%,var(--amber-soft) 0,transparent 60%),var(--surface);border:1px solid var(--line);min-height:280px;position:relative;overflow:hidden}
.hero-art:before,.hero-art:after{content:"";position:absolute;border:1px solid var(--line);border-radius:50%}
.hero-art:before{width:220px;height:220px;left:-40px;bottom:-60px;opacity:.6}
.hero-art:after{width:140px;height:140px;right:20px;top:20px;border-color:var(--teal);opacity:.4}
.section-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:38px 0 18px}
.section-heading h2{font:400 clamp(24px,3vw,32px)/1.1 "DM Serif Display",serif;margin:6px 0 4px;letter-spacing:-.01em}
.section-heading p{color:var(--muted);margin:0;font-size:12.5px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:34px}
.kpi-card{padding:20px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(24,47,64,.05)}
.kpi-value{font:400 40px "DM Serif Display",serif;margin:8px 0 4px}
.kpi-delta{font-size:11px;color:var(--teal);font-weight:700;letter-spacing:.05em}
.assessment-list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.assessment-row{display:grid;grid-template-columns:1.6fr .6fr 1fr .8fr 1.2fr .8fr;gap:14px;padding:16px 20px;align-items:center;border-bottom:1px solid var(--line);font-size:13px}
.assessment-row:last-child{border-bottom:0}
.assessment-row.header{background:var(--surface-2);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:14px 20px}
.person{display:flex;align-items:center;gap:11px}
.person-mark{width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:11px;border:1px solid var(--line)}
.person strong{display:block;font-size:13px}
.person small{color:var(--muted);font-size:11px}
.status-pill{padding:4px 9px;border-radius:20px;font-size:10px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;display:inline-block;text-align:center}
.status-pill.completed{background:var(--teal-soft);color:var(--teal)}
.status-pill.progress{background:var(--amber-soft);color:var(--amber)}
.risk-text{font-size:11px;color:var(--muted)}
.risk-text b{font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:10px}
.risk-low{color:var(--teal)}
.risk-moderate{color:var(--amber)}
.risk-high{color:var(--coral)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.row-btn{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:11px;font-weight:700;color:var(--ink-2);background:var(--bg);transition:all .18s var(--ease)}
.row-btn:hover{border-color:var(--teal);color:var(--teal)}
.empty-state{padding:70px 32px;text-align:center;border:1px dashed var(--line);border-radius:20px;background:var(--surface)}
.empty-state h2{font:400 30px "DM Serif Display",serif;margin:14px 0 8px}
.empty-state p{color:var(--muted);max-width:420px;margin:0 auto 20px}
.empty-illustration{width:120px;height:120px;margin:0 auto 20px;position:relative}
.empty-illustration:before,.empty-illustration:after{content:"";position:absolute;border-radius:50%;border:1.5px dashed var(--line)}
.empty-illustration:before{inset:0}
.empty-illustration:after{inset:20px;border-style:solid;border-color:var(--teal-soft)}
.empty-illustration span{position:absolute;inset:0;display:grid;place-items:center;color:var(--teal);font-size:36px}
.context-panel{background:var(--surface);border-left:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:14px;min-height:100vh;transition:transform .3s var(--ease)}
.context-panel.collapsed{transform:translateX(100%)}
.context-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.context-close{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);color:var(--muted);font-size:16px}
.context-card{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);animation:rise .3s var(--ease)}
.context-card h3{font:400 20px "DM Serif Display",serif;margin:6px 0 8px}
.context-card p{color:var(--ink-2);font-size:12.5px;margin:0}
.summary-line{display:flex;justify-content:space-between;font-size:12px;padding:7px 0;border-bottom:1px solid var(--line);gap:12px}
.summary-line:last-child{border-bottom:0}
.summary-line span{color:var(--muted)}
.summary-line strong{color:var(--ink);font-weight:700;text-align:right}
.section-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.section-chip{padding:5px 10px;border-radius:14px;font-size:10px;letter-spacing:.06em;font-weight:800;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);background:var(--surface);transition:all .2s var(--ease)}
.section-chip.active{background:var(--teal-soft);color:var(--teal);border-color:var(--teal)}
.section-chip.done{background:var(--surface-2);color:var(--ink-2)}
.live-score-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.live-score-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:11.5px}
.live-score-item.active{border-color:var(--teal);background:var(--teal-soft)}
.live-score-item .lsi-name{color:var(--ink-2);font-weight:700}
.live-score-item .lsi-value{font-weight:800;font-size:11px}
.progress-track{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.progress-bar{height:100%;background:var(--teal);border-radius:4px;transition:width .3s var(--ease)}
.progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px;letter-spacing:.02em}
.assessment-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px}
.assessment-title{max-width:640px}
.assessment-title h1{font:400 clamp(30px,4vw,44px)/1.08 "DM Serif Display",serif;letter-spacing:-.02em;margin:8px 0 6px}
.assessment-title p{color:var(--ink-2);margin:0;font-size:14px}
.step-count{text-align:right}
.step-count strong{font:400 34px "DM Serif Display",serif;color:var(--ink);display:block}
.step-count small{color:var(--muted);font-size:11px;letter-spacing:.06em}
.section-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.section-chips .section-chip{cursor:default}
.conversation{max-width:720px}
.system-note{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;background:var(--teal-soft);border-radius:12px;color:var(--teal);font-size:12.5px;margin-bottom:16px;font-weight:600}
.system-orb{width:22px;height:22px;background:var(--teal);color:#fff;border-radius:50%;display:grid;place-items:center;font-size:12px}
.question-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 28px;position:relative;animation:rise .32s var(--ease)}
.question-card .question-label{color:var(--teal);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.question-card h2{font:400 clamp(26px,3.6vw,38px)/1.14 "DM Serif Display",serif;margin:11px 0 10px;letter-spacing:-.02em}
.question-card>p{color:var(--ink-2);margin:0 0 22px}
.answer-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.answer-grid.single{grid-template-columns:1fr}
.answer-button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:15px;text-align:left;color:var(--ink-2);font-weight:700;transition:border-color .2s var(--ease),background .2s var(--ease),color .2s var(--ease),transform .2s var(--ease)}
.answer-button:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-2px)}
.answer-button.selected{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.answer-button .answer-index{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}
.text-input,.select-input,.textarea-input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--ink);outline:none;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.text-input:focus,.select-input:focus,.textarea-input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.textarea-input{min-height:105px;resize:vertical}
.conversation-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.back-button{color:var(--ink-2);padding:12px 4px;font-weight:700;min-height:44px}
.back-button:hover{color:var(--teal)}
.continue-button{background:var(--teal);color:#fff;border-radius:9px;padding:13px 20px;font-weight:800;min-height:46px;min-width:128px;transition:transform .16s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease),opacity .2s var(--ease);box-shadow:0 7px 16px rgba(44,138,131,.18)}
.continue-button:hover,.continue-button.ready{background:#24736e;box-shadow:0 10px 20px rgba(44,138,131,.22);transform:translateY(-1px)}
.continue-button:active{transform:scale(.96)}
.continue-button:disabled{opacity:.42;cursor:not-allowed;box-shadow:none;transform:none}
.review-grid,.result-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
.panel-card{padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.panel-card h3{font:400 22px "DM Serif Display",serif;margin:0 0 14px}
.review-item{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.review-item:last-child{border-bottom:0}
.review-item span{color:var(--muted)}
.risk-card{position:relative;overflow:hidden}
.risk-card:before{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border:1px solid var(--teal);border-radius:50%;opacity:.25}
.risk-score{font:400 58px "DM Serif Display",serif;margin:8px 0}
.risk-level{display:inline-flex;padding:6px 10px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;animation:pulseIn .4s var(--ease)}
.risk-level.low{background:var(--teal-soft);color:var(--teal)}
.risk-level.moderate{background:var(--amber-soft);color:var(--amber)}
.risk-level.high{background:var(--coral-soft);color:var(--coral)}
@keyframes pulseIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.recommendation{margin-top:16px;padding:16px;background:var(--bg);border-radius:12px;color:var(--ink-2);font-size:13px;line-height:1.6;border-left:3px solid var(--teal)}

// ============================================================
// HELPERS
// ============================================================
function t(k){ return translations[state.settings.language][k] || translations.en[k] || k; }
function esc(v=''){ return String(v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function displayStored(q,v){
  if(v==null || v==='') return '—';
  if(state.settings.language==='ta' && q.options){
    const idx=(q.canonicalOptions||q.options).indexOf(v);
    if(q.optionsTa && idx>=0) return q.optionsTa[idx];
  }
  return v;
}
function localizedLabel(q){
  if(!q) return '';
  return state.settings.language==='ta' && q.labelTa ? q.labelTa : (q.label || q.en || '');
}
function localizedOption(q, option, index){
  if(state.settings.language==='ta' && q.optionsTa && q.optionsTa[index]) return q.optionsTa[index];
  return option;
}
function questionText(q){
  if(state.settings.language==='ta' && q.ta) return q.ta;
  return q.en || q.label || '';
}
function riskFor(section, score){
  const b = section.bands.find(([lo,hi])=> score>=lo && score<=hi);
  return b ? b[2] : 'low';
}
function riskLabel(level){ return t(level) + ' ' + (state.settings.language==='ta'?'':'risk').trim(); }
function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString(); }catch{ return '—'; } }
function showToast(msg){
  const el=$('#toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(window.__toast); window.__toast=setTimeout(()=>el.classList.remove('show'),2600);
}
function nextParticipantNumber(){
  // Pick the next unused P-### identifier from saved records and any active draft.
  // Non-standard/manual identifiers are preserved and ignored by the sequence.
  const records = [...(state.completed||[])];
  if(state.draft) records.push(state.draft);
  if(state.assessment) records.push(state.assessment);
  const used = new Set();
  let highest = 0;
  records.forEach(record=>{
    const value = String(record?.demographics?.participantNumber||'').trim();
    const match = /^P-(\d+)$/i.exec(value);
    if(!match) return;
    const number = Number(match[1]);
    if(!Number.isFinite(number) || number < 1) return;
    used.add(number);
    highest = Math.max(highest, number);
  });
  let next = highest + 1;
  while(used.has(next)) next++;
  return `P-${String(next).padStart(3,'0')}`;
}
function freshAssessment(){
  const a={ id:'A-'+Date.now(), createdAt:new Date().toISOString(), demographics:{participantNumber:nextParticipantNumber()}, perception:{} };
  SECTIONS.forEach(s=>a[s.key]=new Array(s.total).fill(null));
  return a;
}
function sectionScore(a, key){
  return (a[key]||[]).filter(v=>v===true).length;
}
function sectionAnsweredCount(a, key){
  return (a[key]||[]).filter(v=>v===true||v===false).length;
}
function overallRiskFor(a){
  // Worst-section rule
  let worst='low', worstKey=null;
  const rank={low:0,moderate:1,high:2};
  SECTIONS.forEach(s=>{
    const sc = sectionScore(a,s.key);
    const anyAnswered = sectionAnsweredCount(a,s.key) > 0;
    if(!anyAnswered) return;
    const r = riskFor(s,sc);
    if(rank[r] > rank[worst]){ worst=r; worstKey=s.key; }
  });
  return {level:worst, key:worstKey};
}
function assessmentIsComplete(a){
  return SECTIONS.every(s => sectionAnsweredCount(a,s.key) === s.total);
}

// ============================================================
// STEP MAP (flat)
// ============================================================
function buildStepMap(){
  const steps=[];
  demographicsQuestions.forEach((q,i)=>steps.push({kind:'demo',index:i,section:'demographics'}));
  SECTIONS.forEach(sec=>{
    sec.questions.forEach((q,i)=>steps.push({kind:'symptom',section:sec.key,index:i}));
  });
  perceptionLikert.forEach((q,i)=>steps.push({kind:'likert',index:i,section:'perception'}));
  perceptionExtras.forEach((q,i)=>steps.push({kind:'perceptionExtra',index:i,section:'perception'}));
  return steps;
}
const stepMap = buildStepMap();

function currentStep(){ return stepMap[state.step]; }
function stepQuestion(s){
  if(s.kind==='demo') return {...demographicsQuestions[s.index], _kind:'demo'};
  if(s.kind==='symptom'){
    const sec = SECTIONS.find(x=>x.key===s.section);
    return {...sec.questions[s.index], _kind:'symptom', _section:sec.key, _index:s.index, type:'yesno'};
  }
  if(s.kind==='likert') return {...perceptionLikert[s.index], _kind:'likert', type:'choice', options:state.settings.language==='ta'?likertOptionsTa:likertOptions, canonicalOptions:likertOptions};
  if(s.kind==='perceptionExtra') return {...perceptionExtras[s.index], _kind:'perceptionExtra'};
}
function getCurrentValue(){
  const s=currentStep(), q=stepQuestion(s);
  if(!state.assessment) return null;
  if(s.kind==='demo') return state.assessment.demographics[q.id];
  if(s.kind==='symptom') return state.assessment[s.section][s.index];
  if(s.kind==='likert' || s.kind==='perceptionExtra') return state.assessment.perception[q.id];
}
function setCurrentValue(v){
  const s=currentStep(), q=stepQuestion(s);
  if(!state.assessment) return;
  if(s.kind==='demo') state.assessment.demographics[q.id]=v;
  else if(s.kind==='symptom') state.assessment[s.section][s.index] = (v==='Yes'?true:(v==='No'?false:v));
  else {
    // Store canonical English values so language switching never corrupts existing answers.
    if((s.kind==='likert' || s.kind==='perceptionExtra') && q.options){
      const idx=q.options.indexOf(v);
      const canonical=(q.canonicalOptions||q.options)[idx];
      state.assessment.perception[q.id]=canonical ?? v;
    } else state.assessment.perception[q.id]=v;
  }
  if(state.settings.autosave) localStorage.setItem('assessment.draft', JSON.stringify(state.assessment));
}
function sectionLabelForStep(s){
  if(s.kind==='demo') return t('demographics');
  if(s.kind==='symptom') return t(s.section) || s.section;
  return t('perception');
}

// -------- Assessment
function assessmentView(){
  if(!state.assessment) { state.assessment = freshAssessment(); state.step=0; }
  const step = currentStep();
  const q = stepQuestion(step);
  const val = getCurrentValue();
  const total = stepMap.length;
  const answered = stepMap.filter((_,i)=>{
    const s=stepMap[i], qq=stepQuestion(s);
    if(s.kind==='demo') return state.assessment.demographics[qq.id]!=null && state.assessment.demographics[qq.id]!=='';
    if(s.kind==='symptom') return state.assessment[s.section][s.index]===true || state.assessment[s.section][s.index]===false;
    return state.assessment.perception[qq.id]!=null && state.assessment.perception[qq.id]!=='';
  }).length;
  const progress = Math.round((answered / total) * 100);
  const isYesno = q._kind==='symptom';
  const isChoice = q.type==='choice';
  const isTextarea = q.type==='textarea';
  const label = isYesno ? questionText(q) : localizedLabel(q);
  const placeholder = state.settings.language==='ta' && q.placeholderTa ? q.placeholderTa : (q.placeholder||'');
  const canonicalValue = val;
  const currentSection = q._kind==='symptom' ? SECTIONS.find(s=>s.key===q._section) : null;
  const currentScore = currentSection ? sectionScore(state.assessment,currentSection.key) : null;
  const currentAnswered = currentSection ? sectionAnsweredCount(state.assessment,currentSection.key) : 0;
  const currentRisk = currentSection && currentAnswered ? riskFor(currentSection,currentScore) : null;
  const scoreCards = SECTIONS.map(s=>{
    const sc=sectionScore(state.assessment,s.key), ans=sectionAnsweredCount(state.assessment,s.key);
    const pct=Math.round((sc/s.total)*100);
    const lvl=ans ? riskFor(s,sc) : null;
    return `<div class="live-score-card ${q._section===s.key?'active':''}">
      <div class="live-score-top"><span>${esc(t(s.key))}</span><b class="${lvl?'risk-'+lvl:''}">${ans?`${sc}/${s.total}`:'—'}</b></div>
      <div class="mini-track"><i style="width:${pct}%"></i></div>
      <small>${ans?`${ans}/${s.total} ${t('answered')}${lvl?' · '+t(lvl):''}`:t('notScored')}</small>
    </div>`;
  }).join('');
  return `<div class="assessment-head">
    <div class="assessment-title"><span class="eyebrow">${sectionLabelForStep(step)}</span><h1>${t('riskAssessment')}</h1><p>${isYesno?t('symptomHint'):'One clear prompt at a time. You can edit answers before submitting.'}</p></div>
    <div class="step-count"><strong>${Math.min(state.step+1,total)}</strong><small>${t('of')} ${total}</small></div>
  </div>

  <div class="live-score-strip">
    <div class="live-score-summary">
      <div class="live-pulse"><span></span>${t('liveNow')}</div>
      <strong>${answered}/${total}</strong><span>${t('answered')}</span>
      <div class="live-progress"><i style="width:${progress}%"></i></div>
      <b>${progress}%</b>
    </div>
    ${currentSection ? `<div class="current-score">
      <span>${esc(t(currentSection.key))} · ${t('score')}</span>
      <strong>${currentScore}/${currentSection.total}</strong>
      ${currentRisk?`<em class="risk-${currentRisk}">${esc(t(currentRisk))}</em>`:''}
    </div>`:''}
  </div>

  <div class="section-chips">${renderChips()}</div>
  <div class="conversation">
    <div class="system-note"><span class="system-orb">✦</span><span>${isYesno?t('symptomHint'):(q._kind==='likert'?'Please indicate how strongly you agree.':'Choose or enter the most appropriate response.')}</span></div>
    <article class="question-card" data-testid="question-card">
      <div class="question-label">${t('question')} ${state.step+1} · ${sectionLabelForStep(step)}</div>

        isYesno ? `<div class="answer-grid yesno-grid">

          <button type="button" class="answer-button no ${val===false?'selected':''}" data-answer="No" data-testid="answer-no"><span class="answer-index">×</span><span>${state.settings.language==='ta'?'இல்லை':'No'}</span><small>${state.settings.language==='ta'?'இந்த அறிகுறி இல்லை':'Symptom not present'}</small></button>
        </div>` :
        isChoice ? `<div class="answer-grid ${q.options.length>2?'':'single'}">${
          q.options.map((o,i)=>`<button type="button" class="answer-button ${String(canonicalValue)===String((q.canonicalOptions||q.options)[i])?'selected':''}" data-answer="${esc((q.canonicalOptions||q.options)[i])}" data-testid="answer-${i}"><span class="answer-index">${i+1}</span><span>${esc(localizedOption(q,o,i))}</span></button>`).join('')
        }</div>` :
        isTextarea ? `<textarea class="textarea-input" id="currentInput" placeholder="${esc(placeholder)}" data-testid="text-input">${esc(val||'')}</textarea>` :
        `<input class="text-input" id="currentInput" type="${q.type==='number'?'number':'text'}" value="${esc(val||'')}" placeholder="${esc(placeholder)}" data-testid="text-input" autofocus>`
      }
      <div class="conversation-footer">
        <button type="button" class="back-button" data-action="back">← ${t('back')}</button>

      </div>
    </article>
    <div class="progress-block">
      <div class="progress-meta"><span>${t('progress')}</span><strong>${progress}%</strong></div>
      <div class="progress-track"><div class="progress-bar" style="width:${progress}%"></div></div>
    </div>
  </div>

  <div class="live-score-mobile">
    <div class="live-mobile-head"><span>● ${t('liveNow')}</span><strong>${currentSection?`${t(currentSection.key)} ${currentScore}/${currentSection.total}`:`${answered}/${total}`}</strong></div>
    <div class="mini-track"><i style="width:${currentSection?Math.round(currentScore/currentSection.total*100):progress}%"></i></div>
  </div>

  <div class="live-score-grid">${scoreCards}</div>
  </div>`;
}
function renderChips(){
  const sections = ['demographics', ...SECTIONS.map(s=>s.key), 'perception'];
  const current = currentStep().section;
  return sections.map(k=>{
    const isCurrent = k===current;
    const isDone = sectionCompleted(k);
    const cls = isCurrent?'active':(isDone?'done':'');
    return `<span class="section-chip ${cls}" data-testid="chip-${k}">${esc(t(k) || k)}</span>`;
  }).join('');
}
function sectionCompleted(key){
  const a = state.assessment; if(!a) return false;
  if(key==='demographics') return demographicsQuestions.every(q=>{
    const v = a.demographics[q.id]; return q.optional || (v!=null && v!=='');
  });
  if(key==='perception'){
    const li = perceptionLikert.every(q=>a.perception[q.id]!=null);
    const ex = perceptionExtras.every(q=> q.optional || (a.perception[q.id]!=null && a.perception[q.id]!==''));
    return li && ex;
  }
  const sec = SECTIONS.find(s=>s.key===key); if(!sec) return false;
  return sectionAnsweredCount(a, key) === sec.total;
}

// EVENT BINDING
// ============================================================
function bindEvents(){
  $$('.nav-item[data-view]').forEach(el=>el.onclick=()=>{
    if(el.dataset.action==='new'){ startAssessment(); }
    else setView(el.dataset.view);
    $('.sidebar').classList.remove('open'); $('#sidebarBackdrop').classList.remove('show');
  });
  $$('[data-action="new"]').forEach(el=>el.onclick=startAssessment);
  $$('[data-action="resume"]').forEach(el=>el.onclick=resumeDraft);
  $$('[data-action="notice"]').forEach(el=>el.onclick=()=>showToast(t('notice')));
  $$('[data-action="review"]').forEach(el=>el.onclick=()=>{ state.view='review'; render(); });
  $$('[data-action="results"]').forEach(el=>el.onclick=()=>{ state.view='results'; render(); });
  $$('[data-action="save"]').forEach(el=>el.onclick=saveAssessment);
  $$('[data-view]:not(.nav-item)').forEach(el=>el.onclick=()=>setView(el.dataset.view));

  // Export actions on results view
  $$('[data-action="export-pdf-current"]').forEach(el=>el.onclick=()=>exportPDF(state.assessment));
  $$('[data-action="export-docx-current"]').forEach(el=>el.onclick=()=>exportDOCX(state.assessment));

  // Row-level actions
  $$('[data-action="view-record"]').forEach(el=>el.onclick=()=>{
    const a = state.completed.find(x=>x.id===el.dataset.id);
    if(a){ state.assessment=a; state.view='results'; render(); }
  });
  $$('[data-action="export-pdf"]').forEach(el=>el.onclick=()=>{
    const a = state.completed.find(x=>x.id===el.dataset.id); if(a) exportPDF(a);
  });
  $$('[data-action="export-docx"]').forEach(el=>el.onclick=()=>{
    const a = state.completed.find(x=>x.id===el.dataset.id); if(a) exportDOCX(a);
  });
  $$('[data-action="bulk-export-pdf"]').forEach(el=>el.onclick=bulkExportPDF);

  // Settings interactions
  $$('[data-setting]').forEach(el=>{
    el.onclick=()=>{
      const key=el.dataset.setting;
      if(el.classList.contains('switch')){
        state.settings[key]=!state.settings[key];
      } else {
        state.settings[key]=el.dataset.value;
      }
      saveSettings(); render();
      if(key!=='theme' && key!=='language') showToast(t('settingsSaved'));
    };
  });
  const saveProfileBtn = $('[data-action="save-profile"]');
  if(saveProfileBtn) saveProfileBtn.onclick=()=>{
    state.settings.researcher=$('#setResearcher').value.trim();
    state.settings.institution=$('#setInstitution').value.trim();
    saveSettings(); updateProfile(); showToast(t('settingsSaved'));
  };
  const clearBtn = $('[data-action="clear-all"]');
  if(clearBtn) clearBtn.onclick=()=>{
    if(confirm(t('confirmClear'))){
      localStorage.removeItem('diabetesAssessments');
      localStorage.removeItem('assessment.draft');
      localStorage.removeItem('settings.v1');
      state.completed=[]; state.draft=null; state.assessment=null;
      state.settings=loadSettings();
      showToast(t('cleared')); setView('dashboard');
    }
  };

  // Assessment interactions
  if(state.view==='assessment'){
    $$('.answer-button').forEach(btn=>btn.onclick=e=>{
      e.preventDefault(); setCurrentValue(btn.dataset.answer); render();
    });
    const input = $('#currentInput');
    if(input){
      input.oninput=()=>{
        setCurrentValue(input.value);
        const next=$('[data-action="continue"]');
        if(next){ const ok = input.value.trim() || stepQuestion(currentStep()).optional; next.disabled = !ok; next.classList.toggle('ready', Boolean(input.value.trim())); }
      };
      input.onkeydown=e=>{ if(e.key==='Enter' && !e.shiftKey && input.value.trim()){ e.preventDefault(); advance(); } };
    }
    const contBtn = $('[data-action="continue"]'); if(contBtn) contBtn.onclick=advance;
    const backBtn = $('[data-action="back"]'); if(backBtn) backBtn.onclick=()=>{ if(state.step>0){state.step--; render();} else setView('dashboard'); };
  }
}

function setView(v){
  state.view=v;
  $$('.nav-item[data-view]').forEach(el=>el.classList.toggle('active', el.dataset.view===v));
  render(); window.scrollTo({top:0,behavior:'smooth'});
}
function startAssessment(){
  state.assessment = freshAssessment();
  state.step = 0;
  setView('assessment');
}
function resumeDraft(){
  if(state.draft){ state.assessment = state.draft; state.step=0; setView('assessment'); }
}
function advance(){
  const step=currentStep(); const q=stepQuestion(step); const v=getCurrentValue();
  const empty = v==null || v===''; 
  if(empty && !q.optional){ showToast(t('required')); return; }
  if(state.step < stepMap.length-1){ state.step++; render(); }
  else { state.view='review'; render(); }
}
function saveAssessment(){
  const a = state.assessment;
  a.completedAt = new Date().toISOString();
  // Replace if exists (by id), else push
  const idx = state.completed.findIndex(x=>x.id===a.id);
  if(idx>=0) state.completed[idx]=a; else state.completed.push(a);
  localStorage.setItem('diabetesAssessments', JSON.stringify(state.completed));
  localStorage.removeItem('assessment.draft'); state.draft=null;
  showToast(t('saved')); setView('reports');
}

// ============================================================
// EXPORTS
// ============================================================
function buildReportRows(a){
  const p = a.demographics||{};
  const demo = demographicsQuestions.map(q=>[q.label, String(p[q.id]||'—')]);
  const sectionRows = [];
  SECTIONS.forEach(s=>{
    const sc = sectionScore(a,s.key); const lvl = riskFor(s,sc);
    sectionRows.push({header:`${s.key.toUpperCase()} — Score ${sc}/${s.total} · ${lvl.toUpperCase()} risk`, rows: s.questions.map((q,i)=>[
      `Q${i+1}. ${q.en}`,
      a[s.key][i]===true?'Yes':(a[s.key][i]===false?'No':'—')
    ]), rec: RECOMMENDATIONS[s.key][lvl]});
  });
  const perceptionRows = [];
  perceptionLikert.forEach(q=>perceptionRows.push([q.label, a.perception[q.id]||'—']));
  perceptionExtras.forEach(q=>perceptionRows.push([q.label, a.perception[q.id]||'—']));
  return {demo, sectionRows, perceptionRows};
}

function exportPDF(a){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt',format:'a4'});
    const {demo, sectionRows, perceptionRows} = buildReportRows(a);
    const overall = overallRiskFor(a);
    const now = new Date().toLocaleString();
    const researcher = state.settings.researcher || 'Researcher';
    const institution = state.settings.institution || '';
    // Header
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text('Diabetes Complication Risk — Screening Report', 40, 46);
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.text(`${researcher}${institution?` · ${institution}`:''}`, 40, 64);
    doc.text(`Generated: ${now}`, 40, 78);
    doc.text(`Participant: ${(a.demographics||{}).participantNumber||'—'}   Record: ${a.id}`, 40, 92);
    doc.setDrawColor(200); doc.line(40, 100, 555, 100);
    // Overall
    doc.setFontSize(12); doc.setFont('helvetica','bold');
    doc.text(`Overall risk (worst section): ${overall.level.toUpperCase()}${overall.key?` — ${overall.key}`:''}`, 40, 120);
    let y = 138;
    // Demographics
    doc.autoTable({startY:y, head:[['Field','Value']], body:demo, styles:{fontSize:9},
      headStyles:{fillColor:[44,138,131]}, margin:{left:40,right:40}});
    y = doc.lastAutoTable.finalY + 14;
    // Sections
    sectionRows.forEach(sec=>{
      if(y>720){ doc.addPage(); y=50; }
      doc.setFont('helvetica','bold'); doc.setFontSize(11);
      doc.text(sec.header, 40, y); y+=6;
      doc.autoTable({startY:y+4, head:[['Question','Answer']], body:sec.rows, styles:{fontSize:9},
        headStyles:{fillColor:[76,93,107]}, margin:{left:40,right:40}, columnStyles:{1:{cellWidth:80}}});
      y = doc.lastAutoTable.finalY + 4;
      doc.setFont('helvetica','italic'); doc.setFontSize(9);
      const recLines = doc.splitTextToSize(`Recommendation: ${sec.rec}`, 500);
      doc.text(recLines, 40, y+10); y += 10 + recLines.length*12 + 8;
    });
    if(y>680){ doc.addPage(); y=50; }
    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text('App perception', 40, y); y+=4;
    doc.autoTable({startY:y+4, head:[['Statement','Response']], body:perceptionRows, styles:{fontSize:9},
      headStyles:{fillColor:[76,93,107]}, margin:{left:40,right:40}});
    y = doc.lastAutoTable.finalY + 20;
    if(y>760){ doc.addPage(); y=50; }
    doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(120);
    const disc = doc.splitTextToSize('Disclaimer: This report provides a screening/risk indication based on entered information. It is not a medical diagnosis and should not replace evaluation by a qualified healthcare professional.', 500);
    doc.text(disc, 40, y);
    doc.save(`risk-report-${(a.demographics||{}).participantNumber||a.id}.pdf`);
    showToast('PDF exported');
  } catch(e){ console.error(e); showToast('PDF export failed'); }
}

function bulkExportPDF(){
  if(!state.completed.length){ showToast('No records to export'); return; }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt',format:'a4'});
    state.completed.forEach((a,idx)=>{
      if(idx>0) doc.addPage();
      const {demo, sectionRows} = buildReportRows(a);
      const overall = overallRiskFor(a);
      doc.setFont('helvetica','bold'); doc.setFontSize(14);
      doc.text(`Record ${idx+1} of ${state.completed.length} — ${(a.demographics||{}).participantNumber||a.id}`, 40, 46);
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      doc.text(`${state.settings.researcher||'Researcher'}${state.settings.institution?` · ${state.settings.institution}`:''}  ·  Generated: ${new Date().toLocaleString()}`, 40, 62);
      doc.setFont('helvetica','bold'); doc.setFontSize(11);
      doc.text(`Overall: ${overall.level.toUpperCase()}${overall.key?` — ${overall.key}`:''}`, 40, 82);
      doc.autoTable({startY:96, head:[['Field','Value']], body:demo, styles:{fontSize:8}, headStyles:{fillColor:[44,138,131]}, margin:{left:40,right:40}});
      let y = doc.lastAutoTable.finalY + 8;
      const scoreRows = sectionRows.map(s=>{
        const m = s.header.match(/^(.+?) — Score (\d+\/\d+) · (\w+)/);
        return m?[m[1],m[2],m[3]+' risk']:[s.header,'',''];
      });
      doc.autoTable({startY:y, head:[['Section','Score','Risk']], body:scoreRows, styles:{fontSize:9}, headStyles:{fillColor:[76,93,107]}, margin:{left:40,right:40}});
    });
    doc.save(`risk-reports-bulk-${Date.now()}.pdf`);
    showToast(`Bulk PDF exported (${state.completed.length} records)`);
  } catch(e){ console.error(e); showToast('Bulk export failed'); }
}

function exportDOCX(a){
  try{
    const D = window.docx;
    const {demo, sectionRows, perceptionRows} = buildReportRows(a);
    const overall = overallRiskFor(a);
    const p = a.demographics||{};
    const now = new Date().toLocaleString();
    const paras = [];
    paras.push(new D.Paragraph({ children:[new D.TextRun({text:'Diabetes Complication Risk — Screening Report',bold:true,size:32})]}));
    paras.push(new D.Paragraph({ children:[new D.TextRun({text:`${state.settings.researcher||'Researcher'}${state.settings.institution?` · ${state.settings.institution}`:''}`,size:22})]}));
    paras.push(new D.Paragraph({ children:[new D.TextRun({text:`Generated: ${now}`,size:20,color:'666666'})]}));
    paras.push(new D.Paragraph({ children:[new D.TextRun({text:`Participant: ${p.participantNumber||'—'}   Record: ${a.id}`,size:20})]}));
    paras.push(new D.Paragraph({ children:[new D.TextRun({text:''})]}));
    paras.push(new D.Paragraph({ children:[new D.TextRun({text:`Overall risk (worst section): ${overall.level.toUpperCase()}${overall.key?` — ${overall.key}`:''}`,bold:true,size:24})]}));
    paras.push(new D.Paragraph({ children:[new D.TextRun({text:''})]}));

    // Demographics table
    paras.push(new D.Paragraph({ children:[new D.TextRun({text:'Demographics',bold:true,size:26})]}));
    paras.push(makeDocTable(D, [['Field','Value'], ...demo]));
    paras.push(new D.Paragraph({ children:[new D.TextRun({text:''})]}));

    sectionRows.forEach(sec=>{
      paras.push(new D.Paragraph({ children:[new D.TextRun({text:sec.header,bold:true,size:24})]}));
      paras.push(makeDocTable(D, [['Question','Answer'], ...sec.rows]));
      paras.push(new D.Paragraph({ children:[new D.TextRun({text:`Recommendation: ${sec.rec}`,italics:true,size:20})]}));
      paras.push(new D.Paragraph({ children:[new D.TextRun({text:''})]}));
    });

    paras.push(new D.Paragraph({ children:[new D.TextRun({text:'App perception',bold:true,size:24})]}));
    paras.push(makeDocTable(D, [['Statement','Response'], ...perceptionRows]));
    paras.push(new D.Paragraph({ children:[new D.TextRun({text:''})]}));
    paras.push(new D.Paragraph({ children:[new D.TextRun({text:'Disclaimer: This report provides a screening/risk indication based on entered information. It is not a medical diagnosis and should not replace evaluation by a qualified healthcare professional.',italics:true,size:18,color:'888888'})]}));

    const doc = new D.Document({ sections:[{ properties:{}, children:paras }] });
    D.Packer.toBlob(doc).then(blob=>{
      window.saveAs(blob, `risk-report-${p.participantNumber||a.id}.docx`);
      showToast('DOCX exported');
    });
  } catch(e){ console.error(e); showToast('DOCX export failed'); }
}
function makeDocTable(D, rows){
  return new D.Table({
    width:{ size:100, type:D.WidthType.PERCENTAGE },
    rows: rows.map((r,ri)=> new D.TableRow({
      children: r.map(c=> new D.TableCell({
        children:[ new D.Paragraph({ children:[new D.TextRun({text:String(c),bold:ri===0,size:ri===0?20:19})] }) ],
        shading: ri===0 ? { fill:'e8f2f0' } : undefined
      }))
    }))
  });
}

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', e=>{
  if(state.view!=='assessment') return;
  if(e.target && ['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if(e.key==='ArrowRight'){ const btn=$('[data-action="continue"]'); if(btn && !btn.disabled) advance(); }
  if(e.key==='ArrowLeft'){ if(state.step>0){ state.step--; render(); } }
});

// ============================================================
// TOP-BAR / GLOBAL EVENTS
// ============================================================
$('#languageToggle').onclick=()=>{
  state.settings.language = state.settings.language==='en'?'ta':'en'; saveSettings(); render();
};
$('#themeToggle').onclick=()=>{
  state.settings.theme = state.settings.theme==='dark'?'light':'dark'; saveSettings(); render();
};
$('#mobileMenu').onclick=()=>{ $('.sidebar').classList.toggle('open'); $('#sidebarBackdrop').classList.toggle('show'); };
$('#sidebarBackdrop').onclick=()=>{ $('.sidebar').classList.remove('open'); $('#sidebarBackdrop').classList.remove('show'); };
$('#collapseContext').onclick=()=>$('#contextPanel').classList.toggle('collapsed');

// Mobile FAB → bottom sheet
$('#mobileContextFab').onclick=()=>{
  $('#sheetContent').innerHTML = $('#contextContent').innerHTML;
  $('#mobileSheet').classList.add('open'); $('#mobileSheet').setAttribute('aria-hidden','false');
};
$('#sheetBackdrop').onclick=()=>{ $('#mobileSheet').classList.remove('open'); $('#mobileSheet').setAttribute('aria-hidden','true'); };

window.addEventListener('resize', ()=>{ $('#mobileContextFab').style.display = state.view==='assessment' && window.innerWidth<=1150 ? 'flex' : 'none'; });

// ============================================================
// BOOT
// ============================================================
render();
</script>
